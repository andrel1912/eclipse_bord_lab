services:
  backend:
    container_name: backend
    platform: linux/amd64
    build:
      context: .
      dockerfile: dockerfiles/backend_Dockerfile
    ports:
      - "8000:8000"

  frontend:
    container_name: frontend
    platform: linux/amd64
    build:
      context: .
      dockerfile: dockerfiles/frontend_Dockerfile
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend